<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>访问测试 · KuroNeko 5etools</title>
<style>
	:root { --bg: #f6f0e4; --card: #fffdf8; --ink: #2b2118; --mute: #7a6a58; --line: #e6dccb; --red: #822000; --good: #2f7d32; --ok: #b06f00; --bad: #b3261e; }
	@media (prefers-color-scheme: dark) { :root { --bg: #1b1612; --card: #251e18; --ink: #f1e6d4; --mute: #b3a28c; --line: #3a2f25; --red: #f0a080; --good: #7bc67e; --ok: #f0b84a; --bad: #ff8a80; } }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
	main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
	h1 { margin: 0 0 4px; font-size: 22px; color: var(--red); }
	.sub { color: var(--mute); font-size: 14px; margin-bottom: 20px; }
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
	.row { display: flex; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
	.row:last-child { border-bottom: 0; }
	.name { flex: 1; }
	.name small { display: block; color: var(--mute); font-size: 13px; }
	.val { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
	.tag { display: inline-block; min-width: 3.2em; text-align: center; padding: 1px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-left: 6px; }
	.t-good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
	.t-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }
	.t-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
	.t-wait { color: var(--mute); }
	#verdict { margin: 20px 0 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; }
	button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; margin-right: 8px; }
	.tip { color: var(--mute); font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<main>
	<h1>✦ 访问测试</h1>
	<div class="sub">打开后会自动测试，大约需要 10～60 秒。测完请<b>截图发给我</b>。本页不收集、也不上传任何信息。</div>
	<div class="card" id="rows"></div>
	<div id="verdict">正在测试……</div>
	<button id="again">再测一次</button><button id="copy">复制结果文字</button>
	<div class="tip">测试内容：① 这个网站的反应速度（连续打开 20 个小文件）② 下载速度（下载一个 5MB 的测试文件）③ 两个图片网站能否打开。<br>可以分别用 Wi-Fi 和手机流量各测一次。</div>
</main>
<script>
"use strict";
const TESTS = [
	{id: "lat", name: "网站反应速度", note: "打开 20 个小文件，平均每个要多久"},
	{id: "dl", name: "下载速度", note: "下载 5MB 测试文件"},
	{id: "img1", name: "图片网站一（国内）", note: "5e.kiwee.top：怪物、职业插图"},
	{id: "img2", name: "图片网站二（GitHub）", note: "raw.githubusercontent.com：备用图片来源"},
];
const results = {};
const $ = id => document.getElementById(id);
const bust = () => "?t=" + Date.now() + Math.random().toString(36).slice(2, 7);

function draw () {
	$("rows").innerHTML = TESTS.map(t => {
		const r = results[t.id];
		const val = r ? r.text : "测试中…";
		const tag = r ? `<span class="tag t-${r.level}">${{good: "很好", ok: "一般", bad: "差"}[r.level]}</span>` : `<span class="tag t-wait">…</span>`;
		return `<div class="row"><div class="name">${t.name}<small>${r?.extra || t.note}</small></div><div class="val">${val}${tag}</div></div>`;
	}).join("");
}

async function timed (url, opts) {
	const t0 = performance.now();
	const r = await fetch(url, {cache: "no-store", ...opts});
	if (!r.ok) throw new Error("HTTP " + r.status);
	const buf = await r.arrayBuffer();
	return {ms: performance.now() - t0, bytes: buf.byteLength};
}

function withTimeout (p, ms) {
	return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("超时")), ms))]);
}

async function testLatency () {
	const times = [];
	for (let i = 0; i < 20; ++i) times.push((await withTimeout(timed(`small/${i}.json${bust()}`), 15000)).ms);
	times.sort((a, b) => a - b);
	const avg = times.slice(0, 18).reduce((a, b) => a + b, 0) / 18;   // drop the two slowest
	return {value: avg, text: `${Math.round(avg)} 毫秒`, level: avg < 300 ? "good" : avg < 900 ? "ok" : "bad"};
}

async function testDownload () {
	const r = await withTimeout(timed(`test-5mb.bin${bust()}`), 120000);
	const mbps = r.bytes / 1048576 / (r.ms / 1000);
	const first = Math.round(25 / mbps);   // roughly what the first visit of the full site downloads
	return {value: mbps, text: `${mbps.toFixed(1)} MB/秒`, extra: `第一次打开整个网站约 ${first} 秒`, level: mbps >= 2 ? "good" : mbps >= 0.5 ? "ok" : "bad"};
}

function testImage (url) {
	return new Promise(resolve => {
		const img = new Image();
		const t0 = performance.now();
		const done = ok => {
			clearTimeout(timer);
			const ms = performance.now() - t0;
			resolve(ok ? {value: ms, text: `${(ms / 1000).toFixed(1)} 秒`, level: ms < 2000 ? "good" : ms < 6000 ? "ok" : "bad"}
				: {value: null, text: "打不开", level: "bad"});
		};
		const timer = setTimeout(() => done(false), 20000);
		img.onload = () => done(true);
		img.onerror = () => done(false);
		img.src = url + bust();
	});
}

async function run () {
	for (const k of Object.keys(results)) delete results[k];
	$("verdict").textContent = "正在测试……";
	$("again").disabled = true;
	draw();
	const jobs = {
		lat: testLatency,
		dl: testDownload,
		img1: () => testImage("https://5e.kiwee.top/img/classes/XGE/Barbarian.webp"),
		img2: () => testImage("https://raw.githubusercontent.com/5etools-mirror-3/5etools-img/main/classes/XGE/Barbarian.webp"),
	};
	for (const t of TESTS) {
		try { results[t.id] = await jobs[t.id](); } catch (e) { results[t.id] = {value: null, text: "失败：" + e.message, level: "bad"}; }
		draw();
	}
	const site = [results.lat.level, results.dl.level];
	const verdict = site.includes("bad") ? "结论：这个网络打开网页版会比较吃力，建议继续用程序版。"
		: site.includes("ok") ? "结论：能用，第一次打开要等一会儿，之后会快很多。"
		: "结论：很顺畅，网页版没问题。";
	$("verdict").textContent = verdict + (results.img1.level === "bad" && results.img2.level === "bad" ? "（另外：插图可能显示不出来。）" : "");
	$("again").disabled = false;
}

$("again").onclick = run;
$("copy").onclick = async () => {
	const text = ["访问测试结果（" + new Date().toLocaleString("zh-CN") + "）",
		...TESTS.map(t => `${t.name}：${results[t.id]?.text ?? "未完成"}${results[t.id]?.extra ? "（" + results[t.id].extra + "）" : ""}`), $("verdict").textContent].join("\n");
	try { await navigator.clipboard.writeText(text); $("copy").textContent = "已复制"; } catch (e) { prompt("请手动复制：", text); }
	setTimeout(() => $("copy").textContent = "复制结果文字", 1500);
};
run();
</script>
</body>
</html>
